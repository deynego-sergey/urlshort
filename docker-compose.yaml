version: '3.8'

services:
  stats-service:
    build:
      context: .
      dockerfile: Dockerfile.stats
    container_name: urlshort-stats
    volumes:
      # Общая память в RAM под Unix-сокет
      - socket-data:/var/run/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SOCKET_PATH=/var/run/app/stats.sock
    restart: unless-stopped

  redirect-service:
    build:
      context: .
      dockerfile: src/Dockerfile.redirect
    container_name: urlshort-redirect
    ports:
      - "8081:8081"
    volumes:
      # Монтируем тот же раздел под сокет
      - socket-data:/var/run/app
      # Отдельный Volume на диске под логи запросов
      - redirect-logs:/app/logs
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - STATS_SOCKET_PATH=/var/run/app/stats.sock
      - LOG_FILE_PATH=/app/logs/access.log
    depends_on:
      - stats-service
    restart: unless-stopped

  api-service:
    build:
      context: .
      dockerfile: src/Dockerfile.api
    container_name: urlshort-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped

volumes:
  socket-data:
    driver_opts:
      type: tmpfs
      device: tmpfs
  redirect-logs: